<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <title>Glücksformat – Damit Ideen keine Ideen bleiben</title>
    <!-- Tenor Sans Font via Google Fonts -->

    <style>
        :root {
            --ci-beige: #B8B1AA;     /* Markenfarbe Beige */
            --bg-light: #FFFFFF;     /* Reinweiß für Header */
            --bg-offwhite: #F9F8F6;  /* Zartes Creme für Über mich */
            --text-beige: #B8B1AA;   /* Beige Fließtext für helle Abschnitte */
            --text-white: #FFFFFF;   /* Weißer Text für beige Abschnitte */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tenor Sans', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-beige);
            line-height: 1.6;
            letter-spacing: 0.02em;
        }

        h1, h2, h3 {
            font-weight: normal;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 70px 20px;
        }

        /* Section Header (1. Seite / Hero) - Reinweiß */
        header {
            background: var(--bg-light);
            text-align: center;
            padding: 90px 20px 70px 20px;
        }

        .logo-container {
            margin-bottom: 35px;
        }

        .logo-img {
            max-width: 320px;
            height: auto;
            display: inline-block;
        }

        header p.intro {
            max-width: 650px;
            margin: 0 auto 35px auto;
            font-size: 1.15rem;
            color: var(--text-beige);
            line-height: 1.8;
        }

        /* Buttons */
        .btn-outline-white {
            display: inline-block;
            border: 1px solid var(--text-white);
            color: var(--text-white);
            padding: 12px 35px;
            border-radius: 2px;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            background: transparent;
        }

        .btn-outline-white:hover {
            background-color: var(--text-white);
            color: var(--ci-beige);
        }

        /* Section 2: 3 Prinzipien - Beige */
        .principles-section {
            background: var(--ci-beige);
            color: var(--text-white);
            padding: 70px 20px;
        }

        .principles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 40px;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .principle-item svg {
            width: 36px;
            height: 36px;
            stroke: var(--text-white);
            stroke-width: 1.5;
            fill: none;
            margin-bottom: 15px;
        }

        .principle-item h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--text-white);
        }

        .principle-item p {
            font-size: 0.9rem;
            color: var(--text-white);
            opacity: 0.9;
        }

        /* Section 3: Wobei ich dich unterstütze - Beige */
        .services-section {
            background: var(--ci-beige);
            color: var(--text-white);
            padding: 0 20px 80px 20px;
        }

        .services-section h2 {
            text-align: center;
            font-size: 1.8rem;
            color: var(--text-white);
            margin-bottom: 50px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 900px;
            margin: 0 auto;
        }

        .service-card {
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 35px 25px;
            border-radius: 2px;
            text-align: center;
        }

        .service-card h3 {
            color: var(--text-white);
            margin-bottom: 15px;
            font-size: 1.15rem;
        }

        .service-card p {
            color: var(--text-white);
            font-size: 0.92rem;
            line-height: 1.7;
            opacity: 0.95;
        }

        /* Section 4: Über mich - Helles Off-White */
        .about-wrapper {
            background: var(--bg-offwhite);
            padding: 80px 20px;
        }

        .about-section {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .about-section {
                flex-direction: row;
            }
        }

        .about-image {
            flex: 1;
            background: #EFECE9;
            height: 280px;
            width: 100%;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-beige);
            font-size: 0.85rem;
            border: 1px solid #E2DDD8;
        }

        .about-text {
            flex: 1.5;
        }

        .about-text h2 {
            font-size: 1.8rem;
            color: var(--text-beige);
            margin-bottom: 20px;
        }

        .about-text p {
            margin-bottom: 15px;
            color: var(--text-beige);
            font-size: 0.95rem;
            line-height: 1.8;
        }

        /* Section 5: Kontakt - Beige */
        .contact-wrapper {
            background: var(--ci-beige);
            color: var(--text-white);
            text-align: center;
            padding: 80px 20px;
        }

        .contact-wrapper h2 {
            color: var(--text-white);
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .contact-wrapper p {
            max-width: 550px;
            margin: 0 auto 35px auto;
            color: var(--text-white);
            font-size: 0.98rem;
            line-height: 1.7;
            opacity: 0.95;
        }
