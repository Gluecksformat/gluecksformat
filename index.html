        }

            margin-bottom: 35px;

            max-width: 320px;
            height: auto;
            display: inline-block;
        }

            max-width: 650px;
            margin: 0 auto 35px auto;
            font-size: 1.15rem;
            color: var(--text-beige);
            line-height: 1.8;
